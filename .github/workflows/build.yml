name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JevAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JevAssistant-apk
          path: JevAssistant.apk

      # Puts the APK on the repo's Releases page so you can download it straight from your phone.
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JevAssistant.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}" \
            --target "${{ github.sha }}"
